[package]
name = "voxcov-py"
version = "0.2.2"
authors = ["Thomas Mulvaney <mulvaney@mailbox.org>"]
edition = "2021"

[lib]
# This is the name of the python library
# eg. 'import voxcov'
name = "voxcov"
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
voxcov = "0.2.2"
numpy = "0.15.0"

[dependencies.pyo3]
version = "0.15.1"
features = ["extension-module"]

[package.metadata.maturin]
# This is the name of the wheel
# eg. 'voxcov-MAJOR-MINOR-RELEASE-platform.whl'
name = "voxcov"

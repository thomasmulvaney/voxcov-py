name: Build wheels
on:
  release:
    types: [created]
jobs:
  build_linux:
    name: Linux, Python ${{ matrix.python.py }}
    runs-on: ${{ matrix.combinations.runs_on }}
    strategy:
      matrix:
        combinations: [
          { runs_on: 'ubuntu-latest',  rust: "x86_64-unknown-linux-gnu" },
        ]
        python: [
            {py: '3.6', interpreter: "python3.6"},
            {py: '3.7', interpreter: "python3.7"},
            {py: '3.8', interpreter: "python3.8"},
            {py: '3.9', interpreter: "python3.9"},
            {py: '3.10', interpreter: "python3.10"}
        ]
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.combinations.rust }}
          default: true
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python.py }}
      - name: linux wheels
        uses: messense/maturin-action@v1
        with:
          maturin-version: latest
          command: build
          manylinux: 2010
          args: -i python${{ matrix.python.py }} --out dist --no-sdist --release
      #- name: test install
      #  run: |
      #    pip install dist/* --force-reinstall
      - name: store artifact
        uses: actions/upload-artifact@v2
        with:
          name: py_wheels
          path: dist

  build_macos:
    name: ${{ matrix.combinations.runs_on }}, Python ${{ matrix.python.py }}
    runs-on: ${{ matrix.combinations.runs_on }}
    strategy:
      matrix:
        combinations: [
          { runs_on: 'macos-11', rust: "aarch64-apple-darwin" },
        ]
        python: [
            {py: '3.6', interpreter: "python3.6", universal: 'no'},
            {py: '3.7', interpreter: "python3.7", universal: 'no'},
            {py: '3.8', interpreter: "python3.8"},
            {py: '3.9', interpreter: "python3.9"},
            {py: '3.10', interpreter: "python3.10"}
        ]
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.combinations.rust }}
          default: true
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python.py }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin pytest numpy twine        
      - name: macos wheels
        if: ${{ matrix.python.universal == 'no'}}
        run: |
          RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" OPENMP_STATIC=1 maturin build -i ${{ matrix.python.interpreter }} --out dist --no-sdist --release
      - name: universal wheels
        if: ${{ matrix.python.universal != 'no' }}
        run: |
          RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" OPENMP_STATIC=1 maturin build -i ${{ matrix.python.interpreter }} --universal2 --out dist --no-sdist --release
      - name: test install
        run: |
          pip install dist/* --force-reinstall
      - name: store artifact
        uses: actions/upload-artifact@v2
        with:
          name: py_wheels
          path: dist

  build_windows:
    name: ${{ matrix.combinations.runs_on }}, Python ${{ matrix.python.py }}
    runs-on: ${{ matrix.combinations.runs_on }}
    strategy:
      matrix:
        combinations: [
          { runs_on: 'windows-latest'},
        ]
        python: [
            {py: '3.6', interpreter: "python3.6"},
            {py: '3.7', interpreter: "python3.7"},
            {py: '3.8', interpreter: "python3.8"},
            {py: '3.9', interpreter: "python3.9"},
            {py: '3.10', interpreter: "python3.10"}
        ]
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          default: true
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python.py }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin pytest numpy twine        
      - name: windows wheels
        run: |
          maturin build -i ${{ matrix.python.interpreter }} --out dist --no-sdist --release
      - name: test install
        run: |
          pip install dist/* --force-reinstall
      - name: store artifact
        uses: actions/upload-artifact@v2
        with:
          name: py_wheels
          path: dist



  upload_all:
    needs: [build_linux, build_macos, build_windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v2
      with:
        name: py_wheels
        path: dist
    - name: Publish to PyPI
      if: "!github.event.release.prerelease"
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
       user: __token__
       password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Publish to TestPyPI
      if: "github.event.release.prerelease"
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
       user: __token__
       repository_url: https://test.pypi.org/legacy/
       password: ${{ secrets.TEST_PYPI_API_TOKEN }}


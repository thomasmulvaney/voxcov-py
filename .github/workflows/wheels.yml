name: Build wheels
on:
  release:
    types: [created]
jobs:
  build_linux:
    name: Linux, Python ${{ matrix.python.py }}
    runs-on: ${{ matrix.combinations.runs_on }}
    strategy:
      matrix:
        combinations: [
          { runs_on: 'ubuntu-latest',  rust: "x86_64-unknown-linux-gnu" },
        ]
        python: [
            {py: '3.10', interpreter: "python3.10"},
        ]
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.combinations.rust }}
          default: true
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python.py }}
      - name: linux wheels
        uses: PyO3/maturin-action@v1
        with:
           command: build
           args: --release -i python3.10 --out dist
      - name: test install
        run: |
          pip install dist/* --force-reinstall
      - name: store artifact
        uses: actions/upload-artifact@v4
        with:
          name: py_wheels
          path: dist

  build_macos:
    name: ${{ matrix.combinations.runs_on }}, Python ${{ matrix.python.py }}
    runs-on: ${{ matrix.combinations.runs_on }}
    strategy:
      matrix:
        combinations: [
          { runs_on: 'macos-latest', rust: "aarch64-apple-darwin" },
        ]
        python: [
            {py: '3.10', interpreter: "python3.10"},
        ]
    steps:
      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          default: true
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python.py }}
      - name: macos wheels
        uses: PyO3/maturin-action@v1
        with:
           command: build
           args: --release -i python3.10 --out dist
      - name: store artifact
        uses: actions/upload-artifact@v4
        with:
          name: py_wheels
          path: dist

  build_windows:
    name: ${{ matrix.combinations.runs_on }}, Python ${{ matrix.python.py }}
    runs-on: ${{ matrix.combinations.runs_on }}
    strategy:
      matrix:
        combinations: [
          { runs_on: 'windows-latest'}
        ]
        python: [
            {py: '3.10', interpreter: "python3.10"},
        ]
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          default: true
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python.py }}
      - name: macos wheels
        uses: PyO3/maturin-action@v1
        with:
           command: build
           args: --release -i python3.10 --out dist
      #- name: test install
      #  run: |
      #    pip install dist/* --force-reinstall
      - name: store artifact
        uses: actions/upload-artifact@v4
        with:
          name: py_wheels
          path: dist



  upload_all:
    needs: [build_linux, build_macos, build_windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v3
      with:
        name: py_wheels
        path: dist
    - name: Publish to PyPI
      if: "!github.event.release.prerelease"
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
       user: __token__
       password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Publish to TestPyPI
      if: "github.event.release.prerelease"
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
       user: __token__
       repository_url: https://test.pypi.org/legacy/
       password: ${{ secrets.TEST_PYPI_API_TOKEN }}

